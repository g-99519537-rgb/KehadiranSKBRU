<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kehadiran Guru</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background: white; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .btn { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 15px; text-align: center; }
        .btn-hadir { background-color: #28a745; }
        .btn-keluar { background-color: #ffc107; color: #000; }
        .btn-absen { background-color: #dc3545; }
        /* Butang PDF disembunyikan secara lalai untuk pengguna biasa */
        .btn-pdf { background-color: #17a2b8; width: 100%; margin-top: 10px; display: none; }
        .status-box { background: #e8f0fe; border-left: 4px solid #1a73e8; padding: 10px 15px; font-size: 0.85em; margin-bottom: 20px; border-radius: 0 6px 6px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid #e0e0e0; }
        th, td { padding: 10px; text-align: left; font-size: 0.9em; }
        th { background-color: #f8f9fa; }
        .admin-panel { margin-top: 25px; text-align: center; border-top: 1px dashed #ccc; padding-top: 15px; }
        .admin-link { color: #666; font-size: 0.85em; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Kehadiran Guru</h2>
    <p class="sub">Pengesahan Lokasi Sekolah & Log Masa Auto</p>

    <div class="status-box" id="lokasi-status">Menyemak status lokasi (GPS)...</div>

    <div class="form-group">
        <label for="namaGuru">Pilih Nama Guru:</label>
        <select id="namaGuru">
            <option value="">-- Memuat naik senarai guru... --</option>
        </select>
    </div>

    <div class="button-group">
        <button class="btn btn-hadir" onclick="prosesKehadiran('Hadir')">Hadir</button>
        <button class="btn btn-keluar" onclick="prosesKehadiran('Keluar')">Pulang</button>
        <button class="btn btn-absen" onclick="prosesKehadiran('Tidak Hadir')">Tidak Hadir</button>
    </div>

    <button class="btn btn-pdf" id="btnPdf" onclick="janaPDF()">Muat Turun Laporan PDF</button>

    <div id="kawasan-cetak">
        <h4 id="tarikh-hari-ini" style="margin-top:25px; margin-bottom:10px;"></h4>
        <table>
            <thead>
                <tr>
                    <th>Masa</th>
                    <th>Nama Guru</th>
                    <th>Status</th>
                    <th>Sebab / Catatan</th>
                </tr>
            </thead>
            <tbody id="jadual-rekod">
            </tbody>
        </table>
    </div>

    <div class="admin-panel">
        <span class="admin-link" id="adminStatus" onclick="logMasukAdmin()">🔒 Log Masuk Admin</span>
    </div>
</div>

<script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwiEr_mzHMF4iEujTGJmeYAjP3Xfb0aHFwollz5gxzxDAWfdF1D8IziyXWBkFsXwpgr/exec";
    const KOORDINAT_SEKOLAH = { lat: 2.660967, lng: 102.419825 };
    const RADIUS_SEKOLAH_KM = 0.05757;

    // KATA LALUAN ADMIN (Tukar kata laluan mengikut keperluan anda di sini)
    const KATA_LALUAN_ADMIN = "1234";
    let isAdmin = false;

    let lokasiSemasa = null;

    document.getElementById('tarikh-hari-ini').innerText = "Rekod Kehadiran: " + new Date().toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    window.addEventListener('DOMContentLoaded', () => {
        muatSenaraiGuru();
        semakGPS();
    });

    // Fungsi Log Masuk Admin
    function logMasukAdmin() {
        if (isAdmin) {
            isAdmin = false;
            document.getElementById('btnPdf').style.display = 'none';
            document.getElementById('adminStatus').innerText = '🔒 Log Masuk Admin';
            alert("Anda telah log keluar daripada Mod Admin.");
            return;
        }

        const inputPass = prompt("Sila masukkan Kata Laluan Admin:");
        if (inputPass === KATA_LALUAN_ADMIN) {
            isAdmin = true;
            document.getElementById('btnPdf').style.display = 'block';
            document.getElementById('adminStatus').innerText = '🔓 Mod Admin Aktif (Klik untuk Log Keluar)';
            alert("Log masuk Admin berjaya! Butang 'Muat Turun Laporan PDF' kini dipaparkan.");
        } else if (inputPass !== null) {
            alert("Kata laluan salah! Akses ditolak.");
        }
    }

    function muatSenaraiGuru() {
        if (!URL_GOOGLE_SCRIPT || URL_GOOGLE_SCRIPT.includes("TAMPAL_URL")) return;

        fetch(URL_GOOGLE_SCRIPT)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('namaGuru');
                select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
                if (data.nama && data.nama.length > 0) {
                    data.nama.forEach(nama => {
                        const opt = document.createElement('option');
                        opt.value = nama;
                        opt.textContent = nama;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Tiada nama guru dijumpai (Sila semak Google Sheets)</option>';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('namaGuru').innerHTML = '<option value="">Ralat memuat senarai guru</option>';
            });
    }

    function semakGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    lokasiSemasa = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('lokasi-status').innerText = "✅ Lokasi GPS berjaya dikesan.";
                    document.getElementById('lokasi-status').style.borderColor = "#28a745";
                },
                (err) => {
                    document.getElementById('lokasi-status').innerText = "⚠️ Ralat GPS: Sila aktifkan pengesanan lokasi pada browser peranti anda.";
                    document.getElementById('lokasi-status').style.borderColor = "#dc3545";
                }
            );
        } else {
            document.getElementById('lokasi-status').innerText = "⚠️ Pelayar anda tidak menyokong fungsi geolokasi.";
        }
    }

    function kiraJarak(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function prosesKehadiran(jenis) {
        const nama = document.getElementById('namaGuru').value;
        if (!nama) {
            alert("Sila pilih nama anda daripada senarai terlebih dahulu.");
            return;
        }

        let sebab = "-";
        const now = new Date();
        const hari = now.getDay();
        const waktuSemasa = now.getHours() * 60 + now.getMinutes();
        const waktuMula = 7 * 60 + 30;

        let waktuTamat = 0;
        if (hari === 1 || hari === 2) waktuTamat = 13 * 60 + 40;
        else if (hari === 3 || hari === 4) waktuTamat = 13 * 60 + 10;
        else if (hari === 5) waktuTamat = 12 * 60 + 5;

        if (jenis === 'Tidak Hadir') {
            sebab = prompt("Sila nyatakan sebab tidak hadir (Contoh: MC / Cuti Rehat):");
            if (!sebab || !sebab.trim()) return;
            simpanDanHantar(nama, jenis, sebab);
            return;
        }

        if (!lokasiSemasa) {
            alert("Lokasi GPS belum dikesan. Pastikan GPS peranti dihidupkan.");
            return;
        }

        const jarak = kiraJarak(lokasiSemasa.lat, lokasiSemasa.lng, KOORDINAT_SEKOLAH.lat, KOORDINAT_SEKOLAH.lng);
        if (jarak > RADIUS_SEKOLAH_KM) {
            alert(`PENAFIAN LOKASI: Anda berada di luar kawasan sekolah! (Jarak dikesan: ${jarak.toFixed(2)} km)`);
            return;
        }

        if (jenis === 'Hadir' && waktuSemasa > waktuMula) {
            sebab = prompt("AMARAN LEWAT: Anda mendaftar hadir selepas 7:30 AM. Sila nyatakan sebab kelewatan:");
            if (sebab === null) return;
        }

        if (jenis === 'Keluar') {
            if (waktuTamat === 0) {
                alert("Hari ini bukan hari persekolahan.");
                return;
            }
            if (waktuSemasa < waktuTamat) {
                sebab = prompt("AMARAN PULANG AWAL: Anda mendaftar keluar sebelum waktu persekolahan tamat. Sila nyatakan sebab:");
                if (sebab === null) return;
            }
        }

        simpanDanHantar(nama, jenis, sebab);
    }

    function simpanDanHantar(nama, jenis, sebab) {
        const masaLengkap = new Date().toLocaleString('ms-MY');
        
        const jadual = document.getElementById('jadual-rekod');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${masaLengkap}</td>
            <td>${nama}</td>
            <td><strong>${jenis}</strong></td>
            <td>${sebab || "-"}</td>
        `;
        jadual.appendChild(row);

        if (URL_GOOGLE_SCRIPT && !URL_GOOGLE_SCRIPT.includes("TAMPAL_URL")) {
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama: nama, jenis: jenis, sebab: sebab || "-", masa: masaLengkap })
            });
        }

        alert(`Rekod ${jenis} berjaya disimpan!`);
        document.getElementById('namaGuru').value = '';
    }

    function janaPDF() {
        if (!isAdmin) {
            alert("Akses ditolak! Hanya Admin sahaja yang boleh menjana PDF.");
            return;
        }
        const elemen = document.getElementById('kawasan-cetak');
        html2pdf().set({
            margin: 0.5,
            filename: `Kehadiran_Guru_${new Date().toISOString().slice(0,10)}.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        }).from(elemen).save();
    }
</script>

</body>
</html>
